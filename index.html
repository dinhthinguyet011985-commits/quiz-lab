.nv:hover{transform:translateX(2px)}.nv.on{box-shadow:inset 3px 0 0 var(--or)}
.btn{box-shadow:0 1px 0 rgba(12,42,28,.025);transition:transform .14s,box-shadow .14s,border-color .14s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 12px rgba(12,42,28,.08)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:16px;padding-bottom:8px}
.tabs button{border-radius:999px;padding:9px 15px}.tabs button.on{box-shadow:0 3px 0 color-mix(in srgb,var(--or) 75%,transparent)}
.rich-toolbar{position:relative;padding:10px 11px;border:1px solid var(--bd);border-radius:15px;background:linear-gradient(120deg,var(--gl),var(--card) 80%);box-shadow:inset 0 1px 0 #fff6;}
.rich-toolbar .rich-tool,.rich-toolbar select,.rich-color{border-radius:9px;transition:background .15s,border-color .15s,transform .15s}
.rich-toolbar .rich-tool:hover,.rich-toolbar select:hover{transform:translateY(-1px);border-color:var(--g)}
.rte-table-config{display:flex;align-items:end;flex-wrap:wrap;gap:9px;padding:12px;margin-top:8px;border:1px solid color-mix(in srgb,var(--g) 25%,var(--bd));border-radius:13px;background:var(--card);box-shadow:0 8px 22px #0e3c2b12}
.rte-table-config[hidden]{display:none!important}
.rte-table-config>label{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--mu)}
.rte-table-config input[type=number]{width:76px;border:1px solid var(--bd);border-radius:8px;padding:7px 8px;background:var(--bg);color:var(--tx)}
.rte-table-config .rte-table-header{display:flex;align-items:center;gap:5px;min-height:34px;color:var(--tx)}
.rte-table-config .rte-table-header input{accent-color:var(--g)}
.tour-layer{position:fixed;inset:0;z-index:10000;background:transparent;cursor:default}
.tour-blocker{position:absolute;inset:0;background:transparent}
.tour-shade-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tour-focus{outline:3px solid var(--or)!important;outline-offset:4px!important;border-radius:14px!important;position:relative}
.tour-popover{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));z-index:10002;border:1px solid #ffffff25;border-radius:20px;padding:18px 19px 16px;color:#f4f8f5;background:linear-gradient(130deg,#123c2d,#1b2b23 78%);box-shadow:0 22px 65px #0007;animation:tour-in .2s ease-out both}
.tour-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tour-kicker{font-size:9px;font-weight:900;letter-spacing:.15em;color:#8fe0b4}.tour-step{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1c;color:#e6f4eb;white-space:nowrap}
.tour-progress{height:4px;background:#ffffff18;border-radius:99px;overflow:hidden;margin:10px 0 14px}.tour-progress i{display:block;height:100%;background:linear-gradient(90deg,#f26a21,#ffba72);border-radius:99px;transition:width .22s}
.tour-body{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:start}.tour-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#f26a211f;color:#ffad6c;font:700 16px Lora,serif;border:1px solid #f26a214f}.tour-body h2{font:700 18px/1.3 'Be Vietnam Pro',sans-serif;color:#fff;margin:0 0 5px}.tour-body p{font-size:12.5px;line-height:1.65;color:#cfdfd5;margin:0}.tour-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.tour-actions .btn{font-size:12px;padding:8px 12px}.tour-actions .btn:not(.or){background:#ffffff0b;color:#eaf4ed;border-color:#ffffff25}.tour-actions .btn.or{background:var(--or);border-color:var(--or);color:white}
@keyframes tour-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:560px){.tour-popover{bottom:max(10px,env(safe-area-inset-bottom));padding:15px;border-radius:17px}.tour-body{grid-template-columns:36px minmax(0,1fr);gap:9px}.tour-mark{width:36px;height:36px;border-radius:11px}.tour-body h2{font-size:16px}.tour-body p{font-size:12px}.tour-actions{align-items:stretch}.tour-actions .acts{gap:6px}.tour-actions .btn{padding:7px 9px;font-size:11px}.rich-toolbar-hint{display:none}}
@media(prefers-reduced-motion:reduce){.tour-popover{animation:none}.card,.btn,.nv{transition:none}}

.creator-note{cursor:default;pointer-events:none;opacity:.88}

/* Quiz Lab v9 — visible progress for longer actions */
.busy-overlay{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:20px;background:rgba(8,22,15,.48);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.busy-overlay[hidden]{display:none!important}
.busy-panel{width:min(360px,100%);display:grid;justify-items:center;text-align:center;gap:11px;padding:26px 24px 22px;border:1px solid color-mix(in srgb,var(--g) 30%,var(--bd));border-radius:22px;background:var(--card);box-shadow:0 24px 75px #0004;animation:busy-in .18s ease-out both}
.busy-spinner{width:48px;height:48px;border:4px solid var(--gl);border-top-color:var(--or);border-right-color:var(--g);border-radius:50%;animation:busy-spin .78s linear infinite}
.busy-title{font:700 17px/1.35 'Be Vietnam Pro',sans-serif;color:var(--tx)}
.busy-sub{font-size:12px;line-height:1.55;color:var(--mu);max-width:280px}
.busy-pulse{display:flex;gap:5px;margin-top:1px}
.busy-pulse i{width:5px;height:5px;border-radius:50%;background:var(--or);animation:busy-pulse .95s ease-in-out infinite}
.busy-pulse i:nth-child(2){animation-delay:.14s;background:var(--g)}.busy-pulse i:nth-child(3){animation-delay:.28s}
@keyframes busy-spin{to{transform:rotate(360deg)}}@keyframes busy-pulse{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}@keyframes busy-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.busy-spinner,.busy-pulse i,.busy-panel{animation:none}}

</style>

const EN_PAIRS_ORDERED=EN_PAIRS.slice().sort((a,b)=>b[0].length-a[0].length);
function translateText(s){if(LANG!=='en')return s;let out=String(s);for(const [vi,en] of EN_PAIRS_ORDERED)out=out.split(vi).join(en);return out}
function translateHTML(s){
 if(LANG!=='en')return s;
 const box=document.createElement('div');box.innerHTML=String(s);
 const skip='.rt-content,.question-stem,.rich-field,.rte,[data-rich-field],#t-in,.qc h2,.qc .chips,.qb p,td';
 const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);const nodes=[];let n;
 while((n=walker.nextNode()))nodes.push(n);
 for(const node of nodes){if(node.parentElement&&node.parentElement.closest(skip))continue;let value=node.nodeValue;for(const [vi,en] of EN_PAIRS_ORDERED)value=value.split(vi).join(en);node.nodeValue=value}
 box.querySelectorAll('[placeholder],[aria-label],[title],[data-ph],[alt]').forEach(el=>{if(el.closest(skip))return;for(const attr of ['placeholder','aria-label','title','data-ph','alt'])if(el.hasAttribute(attr))el.setAttribute(attr,translateText(el.getAttribute(attr)))});
 return box.innerHTML
}

function sanitizeRich(html){
 const tpl=document.createElement('template');tpl.innerHTML=String(html??'');
 const safeColor=v=>/^(#[0-9a-f]{3,8}|[a-z]{3,20}|rgba?\([\d., %]+\))$/i.test(v||'');
 const cleanStyle=el=>{const s=el.style,ok={};
  if(safeColor(s.color))ok.color=s.color;

function parse(buf,name){let rows;V.err='';

V.rows=rows.slice(off).map((r,k)=>{const s=c=>String(r[c]??'').trim(),e=[],text=s(0),ty=s(1).toLowerCase(),opts=[2,3,4,5].map(s);

const isTF=/true\s*[\/-]?\s*false|t\s*\/\s*f|đúng\s*[\/-]?\s*sai|dung\s*[\/-]?\s*sai/.test(ty);
const isSA=/short|sa|điền|dien|ngắn|ngan/.test(ty)||(!ty&&opts.every(o=>!o)&&s(6)!=='');
const qtype=isTF?'tf':isSA?'sa':'mc';
if(!isTF&&!isSA&&ty&&!/multiple|mc|choice|trắc|trac/.test(ty))e.push('Question Type chưa hỗ trợ');
let c=s(6),n=0,tfAnswers=[];
if(isSA){if(!c&&opts[0])c=opts[0];if(!c)e.push('Thiếu đáp án trả lời ngắn')}

const frac=(q,a)=>q.type==='mc'?(a===q.correct?1:0):q.type==='sa'?(matchSA(a,q.answer)?1:0):q.items.reduce((s,it,j)=>s+(a[j]===it.answer?1:0),0)/q.items.length;
function currentQuestionIndex(){return V.order&&V.order[V.i]!==undefined?V.order[V.i]:V.i}
function enqueueReview(idx){if(V.mode!=='p')return;V.reviewCount=V.reviewCount||{};V.reviewQueue=V.reviewQueue||[];V.mastered=V.mastered||{};if(V.mastered[idx]||V.reviewQueue.some(x=>x.idx===idx))return;const delay=V.z.reviewDelay==='end'?Infinity:Math.max(1,+V.z.reviewDelay||3);V.reviewQueue.push({idx,due:Number.isFinite(delay)?(V.primaryDone||0)+delay+1:Infinity});V.reviewCount[idx]=(V.reviewCount[idx]||0)+1}
function resetForReview(idx){const q=V.z.questions[idx];V.ans[idx]=q.type==='tf'?q.items.map(()=>null):q.type==='sa'?'':null;V.chk[idx]=false;V.tries[idx]=[];V.msg[idx]='';V.tt=V.tt||{};V.tt[idx]=0}
function start(z,mode,nm){const tot=totalT(z),n=z.questions.length;go('play',{z,mode,nm,order:Array.from({length:n},(_,i)=>i),seenOriginal:{},primaryDone:0,reviewQueue:[],reviewCount:{},mastered:{},tries:{},first:{},msg:{},flags:{},i:0,ans:z.questions.map(q=>q.type==='tf'?q.items.map(()=>null):q.type==='sa'?'':null),chk:{},tt:{},t0:Date.now(),left:tot,tot,done:false});
if(mode==='s')T=setInterval(()=>{V.left=Math.max(0,V.tot-Math.floor((Date.now()-V.t0)/1000));const e=document.getElementById('tm');if(e){e.textContent=fmtT(V.left);e.classList.toggle('lo',V.left<60)}if(V.left<=0){toast('Hết giờ, bài được nộp tự động');finish()}},500)}
async function finish(){if(V.done||V.finishing)return;V.finishing=true;clearInterval(T);V.used=Math.min(V.tot,Math.floor((Date.now()-V.t0)/1000));
const z=V.z,fr=z.questions.map((q,i)=>frac(q,fa(i))),tot=z.questions.reduce((s,q)=>s+q.points,0),got=z.questions.reduce((s,q,i)=>s+q.points*fr[i],0);V.fr=tot?got/tot:0;V.masteryCount=Object.keys(V.mastered||{}).length;V.masteryPct=z.questions.length?V.masteryCount/z.questions.length*100:0;V.passGoal=!!(z.goal&&V.masteryPct+1e-9>=z.goal);
if(V.nm&&(!ON.gas||z.aid)){const responses=z.questions.map((q,i)=>({qid:q.id,type:q.type,answer:q.type==='mc'?(V.ans[i]===null||V.ans[i]===undefined?null:(q.optionOrder?q.optionOrder[V.ans[i]]:V.ans[i])):clone(V.ans[i])}));const rec={quizId:z.id,title:z.title,name:V.nm,mode:V.mode,got:+got.toFixed(2),tot:+tot.toFixed(2),correct:fr.filter(x=>x===1).length,n:z.questions.length,used:V.used,aid:z.aid||'',late:!!z.late,goal:z.goal||0,pass:z.goal?V.passGoal:false,at:Date.now(),responses};
 try{if(ON.gas){const saved=await gasCall('quizLabApiAdd','attempts',rec,ON.teacherKey);ON.att=[...(ON.att||[]),{...rec,id:saved}]}else if(ON.db){await ON.db.collection('attempts').add(rec)}else{rec.id=uid();refreshLocal();S.liveAtt=S.liveAtt||[];S.liveAtt.push(rec);save();ON.att=[...(ON.att||[]),rec]}}catch(e){V.submitError=e.message||String(e);toast('Chưa gửi được kết quả về báo cáo: '+V.submitError)}
}
stopMusic(false);V.done=true;V.finishing=false;V.dlg=null;render();scrollTo(0,0)}
function qBody(q,idx){const a=V.ans[idx],P=V.mode!=='s',ch=P&&V.chk[idx],tr=V.tries[idx]||[];
let h=`<div class="chips"><span class="chip">${TYPES[q.type]}</span><span class="chip">${q.points} điểm</span></div><div class="question-stem rt-content"><span>${idx+1}.</span> ${renderRich(q.text||'Xác định các mệnh đề sau đúng hay sai')}</div>`+(q.img?`<img class="qimg" src="${q.img}" alt="Ảnh minh họa">`:'');
if(q.type==='mc')h+='<div class="opts">'+q.options.map((o,j)=>`<button class="op${!P&&a===j?' on':''}${ch&&j===q.correct&&(V.z.showAns!=='tf'||tr.includes(j))?' ok':''}${P&&tr.includes(j)&&j!==q.correct?' no':''}" data-a="pick" data-o="${j}"${ch?' disabled':''} aria-pressed="${P?tr.includes(j):a===j}"><span class="lt">${'ABCD'[j]}</span><span class="rt-content">${renderRich(o)}</span></button>`).join('')+'</div>';
else if(q.type==='sa')h+=`<div class="sa-wrap"><input id="sa-in" class="sa-in${ch?(matchSA(a,q.answer)?' ok':' no'):''}" type="text" placeholder="Nhập câu trả lời" value="${esc(a??'')}"${ch?' disabled':''} autocomplete="off" aria-label="Đáp án trả lời ngắn"><p class="mu" style="font-size:12.5px;margin-top:6px">💡 Bạn có thể dùng dấu phẩy (<b>,</b>) hoặc dấu chấm (<b>.</b>) cho số thập phân. Nhấn <b>Enter</b> để chốt đáp án.</p></div>`;
else h+=`<div class="rt-content">${renderRich(q.passage)}</div>`+q.items.map((it,j)=>{const b=v=>`<button class="btn${a[j]===v?(ch?(it.answer===v?' ok':' no'):' on'):''}" data-a="tfp" data-j="${j}" data-v="${v?1:0}"${ch?' disabled':''} aria-pressed="${a[j]===v}">${v?'Đúng':'Sai'}</button>`;return `<div class="tfr"><div class="rt-content">${j+1}) ${renderRich(it.text)}</div><div class="acts">${b(true)}${b(false)}</div></div>`}).join('');
if(ch){const ok=frac(q,a)===1,key=q.type==='mc'?'Đáp án đúng: '+'ABCD'[q.correct]+'. '+richPlain(q.options[q.correct]):q.type==='sa'?'Đáp án đúng: '+q.answer:'Đáp án: '+q.items.map((it,j)=>(j+1)+') '+(it.answer?'Đúng':'Sai')).join(' · ');h+=`<div class="ex${ok?'':' warn'}"><b>${ok?'Chính xác! 🎉 ':'Chưa chính xác; câu này sẽ được ôn lại sau. '}${V.z.showAns==='tf'?'':esc(key)}</b>${q.explain&&V.z.showAns!=='tf'?'<br>'+esc(q.explain):''}</div>`}
return h}
function isAns(q,a){return q.type==='mc'?a!=null:q.type==='sa'?String(a??'').trim()!=='':a.every(x=>x!=null)}
function isSomeAns(q,a){return q.type==='mc'?a!=null:q.type==='sa'?String(a??'').trim()!=='':a.some(x=>x!=null)}
function vPlay(){const{z,mode}=V,n=z.questions.length;if(V.done)return vResult();const seq=V.order||Array.from({length:n},(_,i)=>i),idx=currentQuestionIndex(),q=z.questions[idx],feedback=mode!=='s',ans=V.ans[idx],all=isAns(q,ans),fl=!!(V.flags&&V.flags[idx]);
let h=`<div class="play"><header class="ptop"><b>${esc(z.title)}</b><div class="acts"><span class="chip">${modeLabel(mode)} · lượt ${V.i+1}/${seq.length}${z.aid?' · '+fmtCode(z.aid):''}</span><button class="btn${fl?' flg':''}" data-a="flag" aria-pressed="${fl}" title="Phím tắt: F">🚩 ${fl?'Đã đánh dấu':'Đánh dấu'}</button><button class="btn" data-a="mute" aria-label="Bật hoặc tắt âm thanh">${SND.off?'🔇':'🔊'}</button>${feedback?`<button class="btn" data-a="go" data-p="home">Thoát</button>`:`<span class="tm" id="tm" role="timer">${fmtT(V.left)}</span>`}</div></header><div class="bar"><i style="width:${(V.i+1)/Math.max(1,seq.length)*100}%"></i></div>`;if(mode==='p'&&z.goal)h+=`<p class="mu" style="margin:0 0 12px">Tiến độ làm chủ: <b>${Object.keys(V.mastered||{}).length}/${n}</b> câu · mục tiêu ${z.goal}%</p>`;
h+=`<nav class="pal" aria-label="Danh sách câu gốc">${z.questions.map((x,k)=>{const a=V.ans[k],dn=feedback?!!V.chk[k]:isSomeAns(x,a),fk=V.flags&&V.flags[k];return `<button class="${dn?'dn':''}${k===idx?' cu':''}${fk?' fl':''}" data-a="jump" data-i="${k}" aria-label="Câu ${k+1}${dn?' đã trả lời':''}${fk?' đã đánh dấu':''}">${k+1}</button>`}).join('')}</nav>`;
h+=`<div class="card">${qBody(q,idx)}</div><div class="acts" style="margin-top:14px">`;
if(feedback){if(!V.chk[idx]&&(q.type==='tf'||q.type==='sa'))h+=`<button class="btn or" id="btn-chk" data-a="chk"${all?'':' disabled'}>Chốt đáp án</button>`;if(V.chk[idx])h+=`<button class="btn or" data-a="nx">${V.i<seq.length-1||V.reviewQueue?.length?'Câu tiếp theo →':'Xem kết quả'}</button>`;else if(q.type==='mc')h+=`<span class="mu">Chọn một đáp án để xem phản hồi, rồi tiếp tục. Câu sai ở chế độ Luyện tập sẽ quay lại cho đến khi bạn trả lời đúng.</span>`;h+=`</div>`}
else h+=`<button class="btn" data-a="pv"${V.i?'':' disabled'}>← Câu trước</button><button class="btn" data-a="nx"${V.i<seq.length-1?'':' disabled'}>Câu sau →</button><button class="btn or" data-a="submit">Nộp bài</button></div>`;
h+=`<div class="kbd-bar" aria-hidden="true"><span>⌨️ Phím tắt:</span><span><kbd>A</kbd>–<kbd>D</kbd> / <kbd>1</kbd>–<kbd>4</kbd> Chọn đáp án</span><span><kbd>←</kbd> <kbd>→</kbd> Chuyển câu</span><span><kbd>Enter</kbd> Chốt / Tiếp tục</span><span><kbd>F</kbd> Đánh dấu câu</span></div>`;return h+'</div>'}
function vResult(){const{z,mode}=V,n=z.questions.length,fr=z.questions.map((q,i)=>frac(q,fa(i))),tot=z.questions.reduce((s,q)=>s+q.points,0),got=z.questions.reduce((s,q,i)=>s+q.points*fr[i],0);
const at=(q,a)=>q.type==='mc'?(a==null?'Chưa trả lời':'ABCD'[a]+'. '+richPlain(q.options[a])):q.type==='sa'?(String(a??'').trim()===''?'Chưa trả lời':String(a)):q.items.map((it,j)=>(j+1)+') '+(a[j]==null?'–':a[j]?'Đúng':'Sai')).join(' · ');
const kt=q=>q.type==='mc'?'ABCD'[q.correct]+'. '+richPlain(q.options[q.correct]):q.type==='sa'?q.answer:q.items.map((it,j)=>(j+1)+') '+(it.answer?'Đúng':'Sai')).join(' · ');

xdel:async d=>{try{if(ON.db)await ON.db.doc('attempts/'+d.id).delete();else{refreshLocal();S.liveAtt=(S.liveAtt||[]).filter(x=>x.id!==d.id);save()}ON.att=ON.att.filter(x=>x.id!==d.id);render();toast('Đã xóa kết quả')}catch(e){toast('Chưa xóa được')}},
aclear:async d=>{try{await wipe(d.f,false);render();toast('Đã xóa kết quả')}catch(e){toast('Chưa xóa được')}},
adel:async d=>{try{await wipe(d.id,true);render();toast('Đã xóa báo cáo')}catch(e){toast('Chưa xóa được')}},
rback:()=>{V.f='';render()},
aclose:async d=>{const a=ON.asg.find(x=>x.id===d.id);if(!a)return;a.end=Date.now();a.late=false;if(ON.db){try{await ON.db.doc('assignments/'+a.id).set(a)}catch(e){toast('Chưa đóng được bài')}}else{S.liveAsg=(S.liveAsg||[]).map(x=>x.id===a.id?clone(a):x);save()}render()},
mute:()=>{SND.off=!SND.off;try{localStorage.setItem('quizlab_mute',SND.off?'1':'')}catch(e){}render()},
docs:()=>{const bin=atob(DOCX_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);saveBin('quiz-lab-de-mau-word-15-cau.docx',u,'application/vnd.openxmlformats-officedocument.wordprocessingml.document')},
rgo:d=>{go('report',{f:d.f});Promise.all([loadAtt(),loadPlayers(d.f)]).then(()=>V.p==='report'&&render())},
invt:()=>{V.inv=V.inv===false;render()},
rank:()=>{V.rank=!V.rank;render()},
qr:d=>{if(typeof qrcode==='undefined')return toast('Chưa tải được thư viện mã QR');V.dlg={k:'qr',u:joinLink(d.id)};render()},
dledit:d=>{V.dlg={k:'dl',a:ON.asg.find(x=>x.id===d.id)};render()},
dlsave:async()=>{const a=V.dlg.a,v=new Date(document.getElementById('dl-in').value).getTime();if(!(v>0))return toast('Ngày giờ không hợp lệ');a.end=v;if(ON.db){try{await ON.db.doc('assignments/'+a.id).set(a)}catch(e){toast('Chưa lưu được hạn nộp')}}else{S.liveAsg=(S.liveAsg||[]).map(x=>x.id===a.id?clone(a):x);save()}V.dlg=null;render()},
rnd:()=>{document.getElementById('j-nm').value=randName()},
jtog:d=>{V.nm0=document.getElementById('j-nm')?.value||V.nm0||'';if(d.k==='sfx'){V.sfxChoice=!(V.sfxChoice!==undefined?V.sfxChoice:(V.a.sfx!==false&&!SND.off));SND.off=!V.sfxChoice;try{localStorage.setItem('quizlab_mute',SND.off?'1':'')}catch(e){}if(V.sfxChoice)sfx(true)}else if(d.k==='music'){V.musicChoice=!(V.musicChoice!==undefined?V.musicChoice:MUSIC.pref);setMusic(V.musicChoice)}render()},
jgo:async()=>{const a=V.a,nm=a.anon?anonName(a.id):(document.getElementById('j-nm')?.value||'').trim();if(!nm)return toast('Hãy nhập tên hiển thị');
await Promise.all([loadAtt(),loadPlayers(a.id),loadMetas()]);
const used=await countAttempts(a.id,nm);if(a.attempts&&used>=a.attempts)return toast('Bạn đã dùng hết '+a.attempts+' lượt làm bài này');
try{if(!a.anon)localStorage.setItem('quizlab_name',nm)}catch(e){}
const sfxOn=V.sfxChoice!==undefined?V.sfxChoice:(a.sfx!==false&&!SND.off),musicOn=V.musicChoice!==undefined?V.musicChoice:MUSIC.pref;SND.off=!sfxOn;try{localStorage.setItem('quizlab_mute',SND.off?'1':'')}catch(e){}setMusic(!!musicOn);
await regPlayer(a.id,nm);await loadPlayers(a.id);let meta;if(ON.gas){try{meta=await gasCall('quizLabApiGetQuizForAssignment',a.quizId,a.id)}catch(e){return toast('Không tải được đề: '+(e.message||''))}}else meta=ON.metas.find(x=>x.id===a.quizId)||S.quizzes.find(x=>x.id===a.quizId);if(!meta)return toast('Không tìm thấy đề của bài tập');const z={...meta,retry:a.mode==='p',qtries:0,reviewDelay:a.reviewDelay||3,goal:a.mode==='p'?a.goal||0:0,showAns:a.showAns,after:a.after,sfx:sfxOn,fun:a.fun,aid:a.id,att:a.attempts,anon:a.anon,late:Date.now()>a.end};await begin(z,a.mode||'c',nm,{q:a.shufQ,o:a.shufO})},
lgo:async()=>{const a=V.a;let m;if(ON.gas){try{m=await gasCall('quizLabApiGetQuizForAssignment',a.quizId,a.id)}catch(e){return toast('Không tải được đề: '+(e.message||''))}}else m=ON.metas.find(x=>x.id===a.quizId)||S.quizzes.find(x=>x.id===a.quizId);if(!m)return toast('Không tìm thấy đề của bài tập');
const z={...m,retry:a.mode==='p',qtries:0,reviewDelay:a.reviewDelay||3,goal:a.mode==='p'?a.goal:0,showAns:a.showAns,after:a.after,sfx:a.sfx,fun:a.fun,aid:a.id,att:a.attempts,anon:a.anon,late:Date.now()>a.end,tts:V.tts};
await begin(z,a.mode,V.nm,{q:a.shufQ,o:a.shufO})},
tdemo:()=>{document.getElementById('t-in').textContent=DEMO;typeset(document.getElementById('t-out'))},
tparse:()=>{const el=document.getElementById('t-in'),s=rt(el);if(!s.replace(MK,'').trim())return toast('Hãy dán nội dung đề thi vào ô trước');V.tsrc=s.replace(MK,'');V.trows=parseText(s);const o=document.getElementById('t-out');o.innerHTML=tPrev();typeset(o);o.scrollIntoView()},
tmk:()=>{const ok=(V.trows||[]).filter(r=>!r.e.length&&r.q);S.draft.push(...ok.map(r=>r.q));save();go('review');toast('Đã nạp '+ok.length+' câu vào bản nháp')}
};

document.addEventListener('focusin',e=>{const ed=e.target.closest&&e.target.closest('[data-rich-field]');if(ed){RICH_ACTIVE=ed;const n=document.getElementById('rte-active-note');if(n)n.textContent='Đang chỉnh sửa: '+(ed.getAttribute('aria-label')||'vùng văn bản')}});
document.addEventListener('selectionchange',()=>{const sel=window.getSelection();if(sel&&sel.rangeCount){const node=sel.anchorNode,el=node&&(node.nodeType===1?node:node.parentElement),ed=el&&el.closest&&el.closest('[data-rich-field]');if(ed){RICH_ACTIVE=ed;RICH_RANGE=sel.getRangeAt(0).cloneRange()}}});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-rte-command],[data-rte-table-toggle],[data-rte-table-insert]'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-rte-command]');if(b){applyRichCommand(b.dataset.rteCommand);return}
const toggle=e.target.closest('[data-rte-table-toggle]');if(toggle){const panel=document.getElementById('rte-table-config');if(panel)panel.hidden=!panel.hidden;return}
const insert=e.target.closest('[data-rte-table-insert]');if(insert){const panel=document.getElementById('rte-table-config');let nr=Math.max(1,Math.min(20,parseInt(document.getElementById('rte-table-rows')?.value||'3',10)||3)),nc=Math.max(1,Math.min(12,parseInt(document.getElementById('rte-table-cols')?.value||'3',10)||3)),header=!!document.getElementById('rte-table-header')?.checked;let html='<table class="quiz-rich-table"><tbody>';
for(let r=0;r<nr;r++){html+='<tr>';for(let c=0;c<nc;c++){const tag=header&&r===0?'th':'td',text=header&&r===0?`Tiêu đề ${c+1}`:'Nội dung';html+=`<${tag}>${text}</${tag}>`}html+='</tr>'}html+='</tbody></table><p></p>';insertRichHtml(html);if(panel)panel.hidden=true;return}});
document.addEventListener('change',e=>{if(e.target.id==='rte-color'){applyRichCommand('foreColor',e.target.value);return}if(e.target.id==='rte-symbol'||e.target.id==='rte-math'){const value=e.target.value;e.target.value='';if(value)applyRichCommand('insertText',value)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');
document.querySelectorAll('.mw.open').forEach(w=>{if(!w.contains(e.target)){w.classList.remove('open');w.querySelector('[data-a=menu]').setAttribute('aria-expanded','false')}});
if(!b)return;
if(b.dataset.c&&!b.dataset.sure){b.dataset.sure=1;const t=b.textContent;b.textContent='Chắc chắn?';setTimeout(()=>{b.textContent=t;delete b.dataset.sure},3000);return}
const action=b.dataset.a;if(['dopub','assign','agive','join','joinlink','docode','asgo','jgo','lgo','delq','adel','aclear','xdel'].includes(action)){runWithLoading(action,()=>act[action](b.dataset,b));return}act[action](b.dataset,b)});

/* Phím tắt toàn cục & trong lúc làm bài */
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='j-code')return runWithLoading('join',()=>act.join());
  if(e.key==='Escape'){
    const w=document.querySelector('.mw.open');if(w){w.classList.remove('open');const m=w.querySelector('[data-a=menu]');m.setAttribute('aria-expanded','false');m.focus()}
    else if(V.dlg){V.dlg=null;render()}
    return;
  }
  if(V.p!=='play'||V.done||V.dlg)return;
  const q=V.z.questions[currentQuestionIndex()],inInput=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(inInput){
    if(e.key==='Enter'&&e.target.id==='sa-in'){
      e.preventDefault();
      if(V.mode!=='s'){if(V.chk[currentQuestionIndex()])act.nx();else if(String(V.ans[currentQuestionIndex()]??'').trim())act.chk()}
      else if(V.i<V.z.questions.length-1)act.nx();
    }
    return;
  }
  const k=e.key.toLowerCase();
  if(q.type==='mc'&&['1','2','3','4','a','b','c','d'].includes(k)){
    e.preventDefault();
    const idx='1234'.includes(k)?+k-1:'abcd'.indexOf(k);
    act.pick({o:idx});
  }else if(e.key==='ArrowRight'){
    if(V.mode==='s'&&V.i<V.z.questions.length-1){e.preventDefault();act.nx()}
    else if(V.mode!=='s'&&V.chk[currentQuestionIndex()]){e.preventDefault();act.nx()}
  }else if(e.key==='ArrowLeft'){
    if(V.mode==='s'&&V.i>0){e.preventDefault();act.pv()}
  }else if(e.key==='Enter'){
    if(V.mode!=='s'){
      if(V.chk[currentQuestionIndex()]){e.preventDefault();act.nx()}
      else if((q.type==='tf'||q.type==='sa')&&isAns(q,V.ans[currentQuestionIndex()])){e.preventDefault();act.chk()}
    }else if(V.i<V.z.questions.length-1){e.preventDefault();act.nx()}
  }else if(k==='f'&&!e.ctrlKey&&!e.metaKey){
    e.preventDefault();act.flag();
  }
});
window.addEventListener('storage',e=>{if(e.key==='quizlab'&&V.p==='report'){refreshLocal();Promise.all([loadAsg(),loadAtt(),V.f&&V.f!=='direct'?loadPlayers(V.f):Promise.resolve()]).then(()=>V.p==='report'&&render())}});
init();
render();
</script>
